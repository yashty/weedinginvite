<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Invitation · Shubh Nimantran</title>
  <meta name="theme-color" content="#FBF9F5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip_link">Skip to main content</a>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="index.html"><i data-icon="mark"></i><span>Shubh Nimantran</span></a>
      <nav><div class="nav-links" id="nav-links"><a href="biodata.html" data-i18n="nav_biodata">Biodata</a><div class="nav-tools"><select id="ui-lang" class="lang-select" aria-label="Language"></select><button type="button" class="theme-toggle" aria-pressed="false" aria-label="Dark mode" title="Light / dark"><i data-icon="sun"></i><i data-icon="moon"></i></button></div></div><button type="button" class="burger" id="burger" aria-expanded="false" aria-controls="nav-links" aria-label="Menu"><i data-icon="menu"></i><i data-icon="close"></i></button></nav>
    </div>
  </header>

  <main class="wrap editor" id="main">
    <form id="form" class="form" autocomplete="off" novalidate>
      <div class="editor-head">
        <h1 data-i18n="ed_title"></h1>
        <span class="saved" id="saved" aria-hidden="true"><i></i><span data-i18n="saved_local"></span></span>
      </div>
      <p class="editor-sub" data-i18n="ed_sub"></p>
      <nav class="stepper" id="stepper" aria-label="Steps">
        <button type="button" data-go="1" aria-current="step"><b>1</b><span data-i18n="st1"></span></button>
        <button type="button" data-go="2"><b>2</b><span data-i18n="st2"></span></button>
        <button type="button" data-go="3"><b>3</b><span data-i18n="st3"></span></button>
        <button type="button" data-go="4"><b>4</b><span data-i18n="st4"></span></button>
      </nav>

      <section class="group" data-step="1">
        <h2 data-i18n="ed_details"></h2>
        <p class="note" data-i18n="hint1"></p>
        <label class="field"><span data-i18n="ed_cardof"></span>
          <select name="o"><option value="" data-i18n="ed_card_bride"></option><option value="g" data-i18n="ed_card_groom"></option></select>
        </label>
        <div class="row" id="name-row">
          <label class="field"><span data-i18n="ed_bride"></span><input name="b" maxlength="60"></label>
          <label class="field"><span data-i18n="ed_groom"></span><input name="g" maxlength="60"></label>
        </div>
        <label class="field"><span data-i18n="ed_host"></span><input name="h" maxlength="120"></label>
        <div class="row">
          <label class="field"><span data-i18n="ed_date"></span><input type="date" name="d"></label>
          <label class="field"><span data-i18n="ed_time"></span><input type="time" name="tm"></label>
        </div>
        <div class="row">
          <label class="field"><span data-i18n="ed_venue"></span><input name="v" maxlength="120"></label>
          <label class="field"><span data-i18n="ed_address"></span><input name="a" maxlength="200"></label>
        </div>
        <div class="loc-row">
          <button type="button" class="btn ghost small" id="pick-loc"><i data-icon="pin"></i><span data-i18n="loc_pick"></span></button>
          <span class="loc-status" id="loc-status" hidden>
            <i class="loc-dot"></i><span data-i18n="loc_pinned"></span>
            <a class="loc-coords" id="loc-coords" target="_blank" rel="noopener"></a>
            <button type="button" class="link-btn" id="unpin" data-i18n="loc_remove"></button>
          </span>
        </div>
        <label class="field"><span data-i18n="ed_message"></span><textarea name="m" rows="2" maxlength="300"></textarea></label>
        <label class="field"><span data-i18n="ed_phone"></span><input name="p" type="tel" inputmode="tel" autocomplete="tel" placeholder="919876543210" maxlength="16" aria-describedby="p-err"><span class="field-error" id="p-err" data-i18n="err_phone" hidden></span></label>
      </section>

      <section class="group" data-step="2">
        <h2 data-i18n="ed_events"></h2>
        <p class="note" data-i18n="hint2"></p>
        <div class="events" id="events"></div>
        <p class="empty" id="events-empty" data-i18n="empty_events" hidden></p>
        <button type="button" class="btn ghost small" id="add-event" style="justify-self:start"><i data-icon="plus"></i><span data-i18n="ed_add_event"></span></button>
      </section>

      <section class="group" id="versions-group" data-step="2">
        <h2 data-i18n="ver_title"></h2>
        <p class="note" data-i18n="ver_desc"></p>
        <div class="versions" id="versions"></div>
        <p class="note" id="ver-private" data-i18n="ver_private" hidden></p>
        <button type="button" class="btn ghost small" id="add-version" style="justify-self:start"><i data-icon="plus"></i><span data-i18n="ver_add"></span></button>
      </section>

      <section class="group" data-step="3">
        <h2 data-i18n="ed_template"></h2>
        <p class="note" data-i18n="hint3"></p>
        <div class="swatches" id="swatches" role="group"></div>
      </section>

      <section class="group" id="qr-group" data-step="3">
        <h2 data-i18n="qr_title"></h2>
        <label class="toggle"><span><i data-icon="qr"></i><span data-i18n="qr_show"></span></span><input type="checkbox" id="qr-show" checked></label>
        <div class="field"><span data-i18n="qr_style"></span>
          <div class="qr-styles" id="qr-styles" role="group"></div>
        </div>
        <div class="fmt-row qr-dl" id="qr-dl">
          <button type="button" class="fmt" data-qrfmt="png"><b>PNG</b><span>QR</span></button>
          <button type="button" class="fmt" data-qrfmt="svg"><b>SVG</b><span>QR</span></button>
        </div>
      </section>

      <section class="group" data-step="3">
        <h2 data-i18n="ed_language"></h2>
        <select name="l" id="inv-lang"></select>
      </section>

      <section class="group" id="share-group" data-step="4">
        <h2 data-i18n="ed_share_h"></h2>
        <p class="note" data-i18n="hint4"></p>
      <div class="share">
        <div class="share-link">
          <input id="share-url" readonly aria-label="Invitation link">
          <button type="button" class="btn small" id="copy"><i data-icon="link"></i><span data-i18n="ed_copy"></span></button>
        </div>
        <div class="share-btns">
          <a class="btn small wa" id="wa" target="_blank" rel="noopener"><i data-icon="chat"></i><span data-i18n="ed_whatsapp"></span></a>
          <a class="btn ghost small" id="open" target="_blank" rel="noopener"><i data-icon="external"></i><span data-i18n="ed_open"></span></a>
        </div>
      </div>

      <div class="downloads" id="downloads">
        <h3><i data-icon="download"></i><span data-i18n="dl_title"></span></h3>
        <div class="fmt-row">
          <button type="button" class="fmt" data-fmt="jpg"><b>JPG</b><span>WhatsApp</span></button>
          <button type="button" class="fmt" data-fmt="png"><b>PNG</b><span>HD</span></button>
          <button type="button" class="fmt" data-fmt="pdf"><b>PDF</b><span>A5</span></button>
          <button type="button" class="fmt" data-fmt="story"><b>9:16</b><span data-i18n="dl_story"></span></button>
          <button type="button" class="fmt" data-fmt="video"><b>MP4</b><span data-i18n="ed_video_tab"></span></button>
        </div>
        <p class="note" data-i18n="dl_hint"></p>
      </div>
      </section>

      <div class="step-nav" id="step-nav">
        <button type="button" class="btn ghost" id="step-back"><i data-icon="arrow"></i><span data-i18n="ed_back"></span></button>
        <button type="button" class="btn" id="step-next"><span data-i18n="ed_next"></span><i data-icon="arrow"></i></button>
      </div>
    </form>

    <aside class="side" id="side">
      <label class="showing" id="showing" hidden><span data-i18n="ver_showing"></span><select id="active-version"></select></label>
      <div class="seg" role="group">
        <button type="button" data-view="card" aria-pressed="true"><i data-icon="eye"></i><span data-i18n="ed_card"></span></button>
        <button type="button" data-view="video" aria-pressed="false"><i data-icon="video"></i><span data-i18n="ed_video_tab"></span></button>
      </div>

      <div class="preview" id="card-view"><div id="preview"></div></div>

      <div class="video-box" id="video-view" hidden>
        <div class="phone"><canvas id="video-canvas"></canvas></div>
        <div class="video-tools">
          <label class="toggle"><span><i data-icon="music"></i> <span data-i18n="ed_music"></span></span><input type="checkbox" id="music" checked></label>
          <button type="button" class="btn" id="make-video"><i data-icon="video"></i><span data-i18n="ed_video"></span></button>
          <div class="progress" id="progress" hidden><i></i></div>
          <p class="note" id="video-note" data-i18n="ed_video_note"></p>
          <div class="share-btns" id="video-result" hidden>
            <a class="btn small" id="video-download" download><i data-icon="download"></i><span data-i18n="ed_video_download"></span></a>
            <button type="button" class="btn small wa" id="video-share" hidden><i data-icon="share"></i><span data-i18n="ed_video_share"></span></button>
          </div>
        </div>
      </div>

    </aside>

    <a class="btn jump" href="#side"><i data-icon="eye"></i><span data-i18n="ed_card"></span></a>
  </main>

  <script src="js/vendor/html-to-image.js"></script>
  <script src="js/vendor/motion.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/invite.js"></script>
  <script src="js/video.js"></script>
  <script src="js/vendor/qr-code-styling.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/map.js"></script>
  <script src="js/export.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
