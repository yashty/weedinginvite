<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wedding Invitation</title>
  <meta property="og:title" content="You're invited to our wedding">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="guest">
  <a class="skip" href="#main" data-i18n="skip_link">Skip to main content</a>
  <div class="cover" id="cover">
    <div class="cover-inner">
      <small id="cover-blessing"></small>
      <div id="cover-orn"></div>
      <div class="names" id="cover-names"></div>
      <small id="cover-date"></small>
      <button type="button" class="btn" id="open-btn"></button>
    </div>
  </div>

  <div class="guest-bar">
    <select id="guest-lang" class="lang-select" aria-label="Language"></select>
    <button type="button" class="btn small" id="watch"><i data-icon="play"></i><span id="watch-label"></span></button>
  </div>
  <main class="guest-main" id="main">
    <div id="invite"></div>
    <div class="guest-dl" id="downloads">
      <h3><i data-icon="download"></i><span id="dl-title"></span></h3>
      <div class="fmt-row">
        <button type="button" class="fmt" data-fmt="jpg"><b>JPG</b><span>WhatsApp</span></button>
        <button type="button" class="fmt" data-fmt="pdf"><b>PDF</b><span>A5</span></button>
        <button type="button" class="fmt" data-fmt="story"><b>9:16</b><span id="dl-story"></span></button>
      </div>
    </div>
  </main>

  <div class="player" id="player" role="dialog" aria-modal="true" aria-label="Video" hidden>
    <canvas id="player-canvas"></canvas>
    <button type="button" class="btn small ghost close" id="player-close" style="background:#fff;color:#1d1512"><i data-icon="close"></i><span id="close-label"></span></button>
  </div>

  <script src="js/vendor/motion.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/invite.js"></script>
  <script src="js/video.js"></script>
  <script src="js/vendor/html-to-image.js"></script>
  <script src="js/vendor/qr-code-styling.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/export.js"></script>
  <script>
    hydrateIcons();
    const params = new URLSearchParams(location.hash.slice(1));
    const data = decodeInvite(params.get("d") || "") || SAMPLE;
    if (!TEMPLATES[data.t]) data.t = "royal";
    const select = document.getElementById("guest-lang");
    let lang = LANGS[params.get("l")] ? params.get("l") : (LANGS[data.l] ? data.l : "en");
    const player = new InviteVideo(document.getElementById("player-canvas"), data, lang);
    applyPalette(document.body, data.t);
    document.querySelector('meta[property="og:title"]').content = `${data.b || ""} & ${data.g || ""}`;

    function render() {
      setPageLang(lang);
      document.body.style.setProperty("--script-font", `"${LANGS[lang].font}"`);
      renderInvite(document.getElementById("invite"), data, lang);
      document.getElementById("watch-label").textContent = t(lang, "inv_watch");
      document.querySelector(".skip").textContent = t(lang, "skip_link");
      document.getElementById("close-label").textContent = t(lang, "inv_close");
      document.getElementById("dl-title").textContent = t(lang, "dl_title");
      document.getElementById("dl-story").textContent = t(lang, "dl_story");
      if (data.b || data.g) document.title = `${data.b || ""} & ${data.g || ""}`;
      const cover = document.getElementById("cover");
      if (cover) {
        cover.lang = lang; cover.dir = LANGS[lang].dir;
        document.getElementById("cover-blessing").textContent = t(lang, "inv_blessing");
        document.getElementById("cover-orn").innerHTML = ornamentSvg(tpl(data.t).orn);
        document.getElementById("cover-names").innerHTML = `${esc(data.b)}<span>${esc(t(lang, "inv_and"))}</span>${esc(data.g)}`;
        document.getElementById("cover-date").textContent = fmtDate(lang, data.d);
        document.getElementById("open-btn").textContent = t(lang, "inv_open");
      }
      player.set(data, lang);
    }

    fillLangSelect(select, lang);
    select.addEventListener("change", () => { lang = select.value; FX.swap(document.getElementById("invite"), render); });
    document.getElementById("open-btn").addEventListener("click", () =>
      FX.openCover(document.getElementById("cover"), document.getElementById("invite")));

    const box = document.getElementById("player");
    const watchBtn = document.getElementById("watch");
    const closeBtn = document.getElementById("player-close");
    function closePlayer() {
      if (box.hidden) return;
      player.stop();
      box.hidden = true;
      watchBtn.focus();
    }
    watchBtn.addEventListener("click", async () => {
      box.hidden = false;
      closeBtn.focus();
      FX.pop(box.querySelector("canvas"));
      await player.prepare();
      await player.playWithMusic();
    });
    closeBtn.addEventListener("click", closePlayer);
    box.addEventListener("click", (e) => { if (e.target === box) closePlayer(); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closePlayer();
      if (e.key === "Tab" && !box.hidden) { e.preventDefault(); closeBtn.focus(); } // keep focus inside the dialog
    });
    document.getElementById("open-btn").focus();

    bindDownloads(document.getElementById("downloads"), () => ({ data, lang }));
    render();
  </script>
</body>
</html>
